name: ADBTerm
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  ADBTerm:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        optional: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ADBTerm
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: 需要访问局域网以连接 Android 设备的 ADB。
        NSBonjourServices:
          - _adb._tcp
          - _adb-tls-connect._tcp
          - _adb-tls-pairing._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.adbterm
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "9"
        TARGETED_DEVICE_FAMILY: "1,2"
